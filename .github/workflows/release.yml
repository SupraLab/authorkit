name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-release.sh
          # Build for the matrix target explicitly when needed.
          cargo build -p authorkit-desktop --release --target ${{ matrix.target }}
          # Point package script at the target dir by symlinking into target/release.
          mkdir -p target/release
          BIN="target/${{ matrix.target }}/release/authorkit-desktop"
          if [[ -f "${BIN}.exe" ]]; then
            cp "${BIN}.exe" target/release/authorkit-desktop.exe
          else
            cp "$BIN" target/release/authorkit-desktop
          fi
          SKIP_CARGO_BUILD=1 ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"
          mkdir -p release-out
          cp dist/AuthorKit-* release-out/

      - uses: actions/upload-artifact@v7
        with:
          name: authorkit-${{ matrix.artifact }}
          path: release-out/*

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract changelog section
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Grab ## [VER] … until next ## [
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && $0 ~ /^## \[/ {exit}
            p && $0 ~ /^\[[^]]+\]: / {next}
            p {print}
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "AuthorKit ${VER}" > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo "Built by [SupraLab](https://supralab.fr/en). License: MIT."
            echo ""
            echo "Unsigned preview builds — Gatekeeper / SmartScreen warnings are expected."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AuthorKit ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
