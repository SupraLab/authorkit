name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Fmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Agent config in sync
        run: ./scripts/sync-agent-config.sh --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Test workspace
        run: cargo test --workspace

  coverage:
    name: Coverage (domain crates)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Domain coverage gates
        run: |
          set -euo pipefail
          cargo llvm-cov -p ak-core --fail-under-lines 85 --summary-only
          cargo llvm-cov -p ak-export --fail-under-lines 95 --summary-only
          cargo llvm-cov -p ak-coherence --fail-under-lines 80 --summary-only
          cargo llvm-cov -p ak-llm \
            --ignore-filename-regex 'openai_compat\.rs' \
            --fail-under-lines 85 --summary-only
          cargo llvm-cov -p authorkit-desktop --lib \
            --ignore-filename-regex '(app|brand|theme|widgets|main|i18n|md_layout|providers|panels/)\.rs|panels/' \
            --fail-under-lines 74 --summary-only
      - name: LCOV (artifact)
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info \
            --ignore-filename-regex 'openai_compat\.rs|(apps/desktop/src/(app|brand|theme|widgets|main|i18n|md_layout|providers)\.rs|apps/desktop/src/panels/)'
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
